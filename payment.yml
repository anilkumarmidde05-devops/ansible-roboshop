- name: configure payment server
  hosts: payment
  become: yes
  tasks:
    - name: install python3
      ansible.builtin.dnf:
        name: "{{item}}"
        state: present
      loop:
        - python3
        - gcc
        - python3-devel

    - name: creating roboshop user
      ansible.builtin.user:
        name: roboshop
        system: true
        home: /app
        shell: /sbin/nologin
        comment: "roboshop system user"

    - name: delete folder if exists
      ansible.builtin.file:
        path: /app
        state: absent

    - name: create app directory
      ansible.builtin.file:
        path: /app
        state: directory

    - name: delete the unarchive files
      ansible.builtin.file:
        path: /tmp/payment.zip
        state: absent

    - name: download the payment files
      ansible.builtin.get_url:
        url: https://roboshop-artifacts.s3.amazonaws.com/payment-v3.zip
        dest: /tmp/payment.zip

    - name: unarchive the files
      ansible.builtin.unarchive:
        src: /tmp/payment.zip
        dest: /app
        remote_src: yes

    - name: install dependencies
      ansible.builtin.pip:
        requirements: requirements.txt
        executable: pip3.9
      args: # we are instructing that pip3.9 has to install in /app folder
        chdir: /app

    - name: copy payment repo
      ansible.builtin.template:
        src: payment.service
        dest: /etc/systemd/system/payment.service

    - name: deamon reload
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: start ane enable the payment
      ansible.builtin.service:
        name: payment
        state: restarted
        enabled: yes
