- name: configure user service
  hosts: user
  become: yes
  tasks:
    - name: enable the node js
      ansible.builtin.command: dnf module enable nodejs:20 -y

    - name: Install the nodejs
      ansible.builtin.dnf:
        name: nodejs
        state: present

    - name: creating the system user roboshop
      ansible.builtin.user:
        name: roboshop
        system: true
        comment: "roboshop system user"
        home: /app
        shell: /sbin/nologin

    - name: delete the app directory
      ansible.builtin.file:
        path: /app
        state: absent

    - name: Creates app directory
      ansible.builtin.file:
        path: /app
        state: directory

    - name: delete the user zip file
      ansible.builtin.file:
        path: /tmp/user.zip
        state: absent

    - name: Download user zip file
      ansible.builtin.get_url:
        url: https://roboshop-artifacts.s3.amazonaws.com/user-v3.zip
        dest: /tmp/user.zip

    - name: Unarchive user
      ansible.builtin.unarchive:
        src: /tmp/user.zip
        dest: /app
        remote_src: yes

    - name: install the dependencies
      community.general.npm:
        path: /app

    - name: copy the user service
      ansible.buitin.template: # if we give ansible.builtin.copy then dynamic variables wont be replace it get error like connection refused.
      src: user.service
      dest: /etc/systemd/system/user.service

    - name: deamon reload
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: start and enable the service
      ansible.builtin.service:
        name: user
        state: restarted
        enabled: yes
