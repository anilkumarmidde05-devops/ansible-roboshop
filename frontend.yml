- name: configure frontend server
  hosts: frontend
  become: yes
  tasks:
    - name: install list nginx
      ansible.builtin.command: dnf module list nginx

    - name: enable nginx1.24
      ansible.builtin.command: dnf module enable nginx:1.24

    - name: install nginx
      ansible.builtin.dnf:
        name: nginx
        state: present

    - name: start and enable the nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: yes

    - name: Remove the default content
      ansible.builtin.blockinfile:
        path: /usr/share/nginx/html/*

    - name: delete unarchive folder if any
      ansible.builtin.file:
        path: /tmp/frontend.zip
        state: absent
    - name: Download frontend content
      ansible.builtin.get_url:
        url: https://roboshop-artifacts.s3.amazonaws.com/frontend-v3.zip
        dest: /tmp/frontend.zip

    - name: unarchive the files
      ansible.builtin.unarchive:
        src: /tmp/frontend.zip
        dest: /usr/share/nginx/html

    - name: copy frontend repo
      ansible.builtin.template:
        src: nginx.conf
        dest: /etc/nginx/nginx.conf

    - name: restart the frontend server
      ansible.builtin.service:
        name: frontend
        state: restarted
